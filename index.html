<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Realistic Interactive Globe</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Lato, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
    }

    .world {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      background: #000;
    }
    .world.dragging { cursor: grabbing; }

    /* Same as reference: fills the screen, scaled slightly on zoom. */
    .world-bg {
      position: absolute;
      inset: 0;
      background-position: 50% 50%;
      background-repeat: no-repeat;
      background-size: cover;
      pointer-events: none;
      transform: scale3d(1, 1, 1);
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* White disc behind the globe: fills the 5% gap at both poles. */
    .world-globe-pole {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 530px;
      height: 530px;
      margin: -265px 0 0 -265px;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
      transform: scale(1);
      transform-origin: 50% 50%;
      will-change: transform;
    }

    #globeCanvas {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 580px;
      height: 580px;
      transform: translate3d(-50%, -50%, 0);
      display: block;
      pointer-events: none;
    }

    /*
      Same box and offsets as the reference (730 x 715, margin -368 / -350).
      transform-origin is the globe centre inside that box, so scaling
      keeps the halo exactly aligned with the globe at every zoom level.
    */
    .world-globe-halo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 730px;
      height: 715px;
      margin-left: -368px;
      margin-top: -350px;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      transform: scale(1);
      transform-origin: 368px 350px;
      will-change: transform;
    }
    .world-globe-halo[hidden] { display: none; }

    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(14px, env(safe-area-inset-bottom));
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);
      pointer-events: none;
      z-index: 20;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(80%, 420px);
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid #ff5f5f;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      z-index: 100;
    }
    .message[hidden] { display: none; }

    @media (max-width: 600px) {
      .hint { font-size: 10px; padding-inline: 12px; }
    }
    @media (max-width: 380px) {
      .hint { font-size: 9px; }
    }
  </style>
</head>

<body>
  <div class="world" id="world">
    <div class="world-bg" id="worldBg"></div>
    <div class="world-globe-pole" id="globePole"></div>
    <canvas id="globeCanvas" aria-label="Interactive globe"></canvas>
    <img class="world-globe-halo" id="globeHalo" alt="" aria-hidden="true" draggable="false" hidden>
  </div>

  <div class="hint">Drag to rotate &middot; Scroll or pinch to zoom</div>
  <div class="message" id="message" hidden></div>

  <script>
  (() => {
    "use strict";

    const SOURCES = {
      bg: "assets/globe_bg.jpg",
      diffuse: "assets/globe_diffuse.jpg",
      halo: "assets/globe_halo.png"
    };

    const config = {
      lat: 0,
      lng: 0,
      zoom: 0,                 // current (smoothed) zoom, 0..1
      autoSpin: true,
      isHaloVisible: true,
      isPoleVisible: true,
      spinDegreesPerSecond: 12, // reference: 0.2 deg per frame at 60 fps
      maxDpr: 2,
      maxBufferPx: 2048
    };

    /* ---- Constants taken from the reference ---- */
    const BASE_GLOBE_SIZE = 536;     // globe diameter in px
    const PERSPECTIVE = (BASE_GLOBE_SIZE / 2) / 4000; // offset = 1 + z / 4000 (z in px)
    const POLE_GAP = 0.05;           // v = 0.05 .. 0.95 of the sphere
    const SEG_X = 72;
    const SEG_Y = 36;
    const EXTENT = 1.08;             // canvas half-size in globe radii (small safety margin)

    /* ---- DOM ---- */
    const world = document.getElementById("world");
    const worldBg = document.getElementById("worldBg");
    const globePole = document.getElementById("globePole");
    const canvas = document.getElementById("globeCanvas");
    const globeHalo = document.getElementById("globeHalo");
    const message = document.getElementById("message");

    /* ---- State ---- */
    let gl = null, program = null, texture = null;
    let vertexBuffer = null, indexBuffer = null, indexCount = 0;
    let uRotY, uRotX, uExtent, uTexture;
    let glReady = false;
    let isWebGL2 = false;
    let diffuseImage = null;

    let zoomTarget = 0;
    let needsResize = true;
    let lastFrameTime = performance.now();
    let tween = null;

    let isPointerDown = false;
    const pointers = new Map();
    let dragX = 0, dragY = 0, dragLat = 0, dragLng = 0;
    let pinchStartDist = 0, pinchStartZoom = 0;

    /* ---- Helpers ---- */
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const clampLng = (l) => ((((l + 180) % 360) + 360) % 360) - 180;
    const degToRad = (d) => d * Math.PI / 180;
    const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
    const isPOT = (n) => (n & (n - 1)) === 0;

    function showMessage(html) { message.innerHTML = html; message.hidden = false; }
    function hideMessage() { message.hidden = true; }

    /* ---- Shaders ----
       The vertex shader repeats the reference's rotate() maths exactly:
       rotate around Y, then X, then a weak depth scale of 1 + z/4000.
       Screen y points down in the reference, so it is flipped for clip space.
       Triangles are front-facing (CCW) only on the near side, so back-face
       culling hides the far side just like the reference does. */
    const vertexShaderSource = `
      attribute vec3 aPosition;
      attribute vec2 aUv;
      uniform vec2 uRotY;   // sin, cos of rY
      uniform vec2 uRotX;   // sin, cos of -rX
      uniform float uExtent;
      varying vec2 vUv;

      void main() {
        vUv = aUv;
        float x0 = aPosition.x * uRotY.y - aPosition.z * uRotY.x;
        float z0 = aPosition.z * uRotY.y + aPosition.x * uRotY.x;
        float y0 = aPosition.y * uRotX.y - z0 * uRotX.x;
        z0 = z0 * uRotX.y + aPosition.y * uRotX.x;
        float k = 1.0 + z0 * ${PERSPECTIVE.toFixed(6)};
        gl_Position = vec4(x0 * k / uExtent, -y0 * k / uExtent, 0.0, 1.0);
      }
    `;

    const fragmentShaderSource = `
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif
      uniform sampler2D uTexture;
      varying vec2 vUv;
      void main() {
        gl_FragColor = texture2D(uTexture, vUv);
      }
    `;

    /* ---- WebGL setup ---- */
    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(s);
        gl.deleteShader(s);
        throw new Error("Shader compile failed: " + log);
      }
      return s;
    }

    function createProgram() {
      const vs = compile(gl.VERTEX_SHADER, vertexShaderSource);
      const fs = compile(gl.FRAGMENT_SHADER, fragmentShaderSource);
      const p = gl.createProgram();
      gl.attachShader(p, vs);
      gl.attachShader(p, fs);
      gl.bindAttribLocation(p, 0, "aPosition");
      gl.bindAttribLocation(p, 1, "aUv");
      gl.linkProgram(p);
      gl.deleteShader(vs);
      gl.deleteShader(fs);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        const log = gl.getProgramInfoLog(p);
        gl.deleteProgram(p);
        throw new Error("Program link failed: " + log);
      }
      return p;
    }

    function createSphereMesh() {
      const vertices = [];
      const indices = [];

      for (let y = 0; y <= SEG_Y; y++) {
        const v = y / SEG_Y;                                // texture v: full image height
        const theta = (POLE_GAP + v * (1 - 2 * POLE_GAP)) * Math.PI; // geometry: 5%..95%
        const sinT = Math.sin(theta), cosT = Math.cos(theta);

        for (let x = 0; x <= SEG_X; x++) {
          const u = x / SEG_X;
          const phi = u * Math.PI * 2;
          vertices.push(
            -Math.cos(phi) * sinT,
            -cosT,
            Math.sin(phi) * sinT,
            u,
            v
          );
        }
      }

      const row = SEG_X + 1;
      for (let y = 0; y < SEG_Y; y++) {
        for (let x = 0; x < SEG_X; x++) {
          const a = y * row + x, b = a + 1, c = a + row, d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      vertexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

      indexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);
      indexCount = indices.length;
    }

    function createTexture(image) {
      texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

      /* The mesh duplicates the seam column, so clamping is safe and also
         works for non power-of-two textures on WebGL 1. */
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);

      const canMip = isWebGL2 || (isPOT(image.naturalWidth) && isPOT(image.naturalHeight));
      if (canMip) {
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        const ext = gl.getExtension("EXT_texture_filter_anisotropic");
        if (ext) {
          const max = gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
          gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(4, max));
        }
      } else {
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      }
    }

    function setupGL(image) {
      program = createProgram();
      gl.useProgram(program);

      uRotY = gl.getUniformLocation(program, "uRotY");
      uRotX = gl.getUniformLocation(program, "uRotX");
      uExtent = gl.getUniformLocation(program, "uExtent");
      uTexture = gl.getUniformLocation(program, "uTexture");

      createSphereMesh();
      createTexture(image);

      gl.disable(gl.DEPTH_TEST);
      gl.enable(gl.CULL_FACE);
      gl.cullFace(gl.BACK);
      gl.frontFace(gl.CCW);
      gl.clearColor(0, 0, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.uniform1i(uTexture, 0);
      gl.uniform1f(uExtent, EXTENT);
    }

    function initialiseWebGL(image) {
      const opts = {
        alpha: true,
        antialias: true,
        depth: false,
        stencil: false,
        premultipliedAlpha: true,
        preserveDrawingBuffer: false,
        powerPreference: "high-performance"
      };

      gl = canvas.getContext("webgl2", opts);
      isWebGL2 = !!gl;
      if (!gl) {
        gl = canvas.getContext("webgl", opts) || canvas.getContext("experimental-webgl", opts);
      }
      if (!gl) throw new Error("WebGL is not available in this browser.");

      setupGL(image);
      glReady = true;
    }

    /* ---- Responsive sizing ---- */
    function getViewportSize() {
      const vv = window.visualViewport;
      return {
        width: vv && vv.width ? vv.width : window.innerWidth,
        height: vv && vv.height ? vv.height : window.innerHeight
      };
    }

    /* Fit factor: 1.0 on laptops (identical to the reference 536 px globe),
       smaller on phones so the globe and halo stay fully on screen. */
    function getFitScale() {
      const { width, height } = getViewportSize();
      const shortest = Math.min(width, height);
      const isMobile = Math.max(width, height) <= 600;
      const ratio = isMobile ? 0.74 : 0.78;
      const size = clamp(shortest * ratio, isMobile ? 170 : 295, isMobile ? 460 : BASE_GLOBE_SIZE);
      return size / BASE_GLOBE_SIZE;
    }

    function getTotalScale() {
      /* Reference: ratio = 1 + zoom^1.5 * 3 */
      return getFitScale() * (1 + Math.pow(config.zoom, 1.5) * 3);
    }

    function resizeCanvas() {
      const scale = getTotalScale();
      const cssSize = BASE_GLOBE_SIZE * scale * EXTENT;
      const dpr = Math.min(window.devicePixelRatio || 1, config.maxDpr);

      /* Quantised buffer size avoids reallocating the framebuffer every frame
         while zooming; the cap keeps phones within their GPU limits. */
      let px = Math.ceil((cssSize * dpr) / 32) * 32;
      px = clamp(px, 64, config.maxBufferPx);

      if (canvas.width !== px || canvas.height !== px) {
        canvas.width = px;
        canvas.height = px;
        gl.viewport(0, 0, px, px);
      }

      canvas.style.width = cssSize + "px";
      canvas.style.height = cssSize + "px";

      const t = "scale(" + scale + ")";
      globeHalo.style.transform = t;
      globePole.style.transform = t;

      /* Reference: background ratio = 1 + zoom^3 * 0.3 */
      const bg = 1 + Math.pow(config.zoom, 3) * 0.3;
      worldBg.style.transform = "scale3d(" + bg + "," + bg + ",1)";
    }

    /* ---- Render ---- */
    function render(dt) {
      if (config.autoSpin && !isPointerDown && !tween) {
        config.lng = clampLng(config.lng - config.spinDegreesPerSecond * dt);
      }

      globeHalo.style.display = config.isHaloVisible && !globeHalo.hidden ? "block" : "none";
      globePole.style.display = config.isPoleVisible ? "block" : "none";

      const rY = degToRad(clampLng(config.lng) - 270);
      const rX = degToRad(config.lat);

      gl.useProgram(program);
      gl.uniform2f(uRotY, Math.sin(rY), Math.cos(rY));
      gl.uniform2f(uRotX, Math.sin(-rX), Math.cos(-rX));

      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
    }

    /* ---- Animation loop ---- */
    function updateTween(now) {
      if (!tween) return;
      const p = tween.duration <= 0 ? 1 : clamp((now - tween.start) / tween.duration, 0, 1);
      const e = easeInOutSine(p);
      config.lat = tween.lat + tween.dLat * e;
      config.lng = clampLng(tween.lng + tween.dLng * e);
      if (p >= 1) {
        if (tween.zoomTo !== null) zoomTarget = tween.zoomTo;
        tween = null;
      }
    }

    function updateZoom(dt) {
      const diff = zoomTarget - config.zoom;
      if (diff === 0) return;
      /* Frame-rate independent easing gives smooth wheel and pinch zoom. */
      config.zoom += diff * (1 - Math.exp(-dt * 14));
      if (Math.abs(zoomTarget - config.zoom) < 0.0004) config.zoom = zoomTarget;
      needsResize = true;
    }

    function frame(now) {
      const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
      lastFrameTime = now;

      updateTween(now);
      updateZoom(dt);

      if (glReady) {
        if (needsResize) {
          needsResize = false;
          resizeCanvas();
        }
        render(dt);
      }
      requestAnimationFrame(frame);
    }

    /* ---- Public navigation helper ---- */
    function goTo(lat, lng, zoomTo) {
      const targetLng = clampLng(lng);
      let dLng = targetLng - config.lng;
      if (dLng > 180) dLng -= 360;
      if (dLng < -180) dLng += 360;
      const dLat = lat - config.lat;
      const distance = Math.sqrt(dLat * dLat + dLng * dLng);

      tween = {
        start: performance.now(),
        duration: clamp(distance * 0.01, 0.2, 1.5) * 1000,
        lat: config.lat,
        lng: config.lng,
        dLat,
        dLng,
        zoomTo: typeof zoomTo === "number" ? clamp(zoomTo, 0, 1) : null
      };
    }

    /* ---- Pointer / touch ---- */
    function beginDrag(x, y) {
      dragX = x; dragY = y;
      dragLat = config.lat; dragLng = config.lng;
    }

    function pinchDistance() {
      const [a, b] = Array.from(pointers.values());
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function onPointerDown(e) {
      tween = null;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { world.setPointerCapture(e.pointerId); } catch (_) {}

      if (pointers.size === 1) {
        beginDrag(e.clientX, e.clientY);
      } else if (pointers.size === 2) {
        pinchStartDist = pinchDistance();
        pinchStartZoom = zoomTarget;
      }

      isPointerDown = true;
      world.classList.add("dragging");
    }

    function onPointerMove(e) {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      p.x = e.clientX;
      p.y = e.clientY;

      if (pointers.size >= 2) {
        const { width, height } = getViewportSize();
        const span = Math.min(width, height) * 0.8;
        zoomTarget = clamp(pinchStartZoom + (pinchDistance() - pinchStartDist) / span, 0, 1);
        return;
      }

      /* Same drag mapping as the reference: 0.5 degrees per pixel. */
      config.lat = clamp(dragLat + (e.clientY - dragY) * 0.5, -90, 90);
      config.lng = clampLng(dragLng - (e.clientX - dragX) * 0.5);
    }

    function onPointerUp(e) {
      if (!pointers.delete(e.pointerId)) return;

      if (pointers.size === 1) {
        const rest = pointers.values().next().value;
        beginDrag(rest.x, rest.y);
      }
      if (pointers.size === 0) {
        isPointerDown = false;
        world.classList.remove("dragging");
      }
    }

    function onWheel(e) {
      e.preventDefault();
      /* deltaMode 1 = lines (some mice / Firefox); normalise to pixels. */
      const delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
      zoomTarget = clamp(zoomTarget - delta * 0.001, 0, 1);
    }

    function onDoubleClick() {
      zoomTarget = zoomTarget > 0.4 ? 0 : 0.55;
    }

    /* ---- Loading ---- */
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = "async";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Could not load " + url));
        img.src = url;
      });
    }

    async function init() {
      try {
        hideMessage();

        const [diffuse, bg, halo] = await Promise.all([
          loadImage(SOURCES.diffuse),
          loadImage(SOURCES.bg).catch(() => null),
          loadImage(SOURCES.halo).catch(() => null)
        ]);

        diffuseImage = diffuse;

        if (bg) worldBg.style.backgroundImage = 'url("' + SOURCES.bg + '")';
        if (halo) {
          globeHalo.src = SOURCES.halo;
          globeHalo.hidden = false;
        }

        initialiseWebGL(diffuseImage);
        resizeCanvas();

        canvas.addEventListener("webglcontextlost", (e) => {
          e.preventDefault();
          glReady = false;
        });
        canvas.addEventListener("webglcontextrestored", () => {
          try {
            setupGL(diffuseImage);
            glReady = true;
            canvas.width = 0; // force viewport refresh
            needsResize = true;
          } catch (err) {
            console.error(err);
          }
        });

        world.addEventListener("dragstart", (e) => e.preventDefault());
        world.addEventListener("pointerdown", onPointerDown);
        world.addEventListener("pointermove", onPointerMove);
        world.addEventListener("pointerup", onPointerUp);
        world.addEventListener("pointercancel", onPointerUp);
        world.addEventListener("lostpointercapture", onPointerUp);
        world.addEventListener("wheel", onWheel, { passive: false });
        world.addEventListener("dblclick", onDoubleClick);

        const queueResize = () => { needsResize = true; };
        window.addEventListener("resize", queueResize, { passive: true });
        window.addEventListener("orientationchange", queueResize, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", queueResize, { passive: true });
        }

        window.GlobeApp = {
          config,
          goTo,
          setZoom: (z) => { zoomTarget = clamp(z, 0, 1); },
          resize: queueResize
        };

        lastFrameTime = performance.now();
        requestAnimationFrame(frame);
      } catch (error) {
        console.error(error);
        showMessage(
          "Could not initialise the globe.<br><br>" +
          "Make sure the repository contains:<br><br>" +
          "<code>assets/globe_diffuse.jpg</code><br>" +
          "<code>assets/globe_bg.jpg</code><br>" +
          "<code>assets/globe_halo.png</code> (optional)<br><br>" +
          "Also make sure the browser supports WebGL."
        );
      }
    }

    init();
  })();
  </script>
</body>
</html>
