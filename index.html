<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Realistic Interactive Globe</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Lato, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
    }

    .world {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      background: #000;
    }
    .world.dragging { cursor: grabbing; }

    /* Same as reference: fills the screen, scaled slightly on zoom. */
    .world-bg {
      position: absolute;
      inset: 0;
      background-position: 50% 50%;
      background-repeat: no-repeat;
      background-size: cover;
      pointer-events: none;
      transform: scale3d(1, 1, 1);
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* White disc behind the globe: fills the 5% gap at both poles. */
    .world-globe-pole {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 530px;
      height: 530px;
      margin: -265px 0 0 -265px;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
      transform: scale(1);
      transform-origin: 50% 50%;
      will-change: transform;
    }

    #globeCanvas {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 580px;
      height: 580px;
      transform: translate3d(-50%, -50%, 0);
      display: block;
      pointer-events: none;
    }

    /*
      Same box and offsets as the reference (730 x 715, margin -368 / -350).
      transform-origin is the globe centre inside that box, so scaling
      keeps the halo exactly aligned with the globe at every zoom level.
    */
    .world-globe-halo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 730px;
      height: 715px;
      margin-left: -368px;
      margin-top: -350px;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      transform: scale(1);
      transform-origin: 368px 350px;
      will-change: transform;
    }
    .world-globe-halo[hidden] { display: none; }


    /* ===== Cube lamp (from cube-lamp.html; page background removed, scoped to .cube-dock) ===== */
    @keyframes cubeFadeOut {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    .cube-dock .scene {
        width: 250px;
        height: 250px;
        transform: rotatex(65deg) rotatez(45deg);
        transform-style: preserve-3d;
    }

    .cube-dock .main-cube {
        transform-style: preserve-3d;
        position: absolute;
    }

    .cube-dock .main-cube {
        width: 250px;
        height: 250px;
    }

    .cube-dock .side {
        border: 8px solid black;
        position: absolute;
        box-sizing: border-box;
    }

    .cube-dock .main-cube__side-top {
        width: 250px;
        height: 250px;
        translate: 0px 0px 125px;
        background-color: rgb(220, 220, 220);
        transform-style: preserve-3d;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .cube-dock .hatching {
        background-image: repeating-linear-gradient(
          90deg,
          transparent,
          transparent 15px,
          #000 10px,
          #000 20px
        );
        background-color: rgb(255, 255, 255);
    }

    .cube-dock .main-cube__side-front {
        width: 250px;
        height: 250px;
        translate: 125px 0px 0px;
        transform: rotatey(90deg);
    }

    .cube-dock .main-cube__side-left {
        width: 250px;
        height: 250px;
        translate: 0px 125px 0px;
        transform: rotatex(90deg);
    }

    .cube-dock .main-cube__inside {
        position: absolute;
    }

    .cube-dock .main-cube__inside--bottom {
        translate: 0px 30px -90px;
        transform: rotatez(90deg);
        width: 100%;
        height: calc(70% + 16px);
        background-color: rgb(255, 255, 255);
    }

    .cube-dock .rotating-light-bottom {
        opacity: 0.8;
        position: absolute;
        width: 160px;
        height: 130%;
        background-color: rgb(193, 193, 193);
        translate: 46px 150px -81px;
        background: linear-gradient(
          180deg,
          rgb(255, 255, 255) 0%,
          rgba(255, 255, 255, 0.31) 50%,
          rgba(255, 0, 0, 0) 100%
        );
    }

    .cube-dock .rotating-light-back {
        opacity: 0.8;
        position: absolute;
        width: 165px;
        height: 130%;
        transform: rotatey(90deg);
        background-color: rgb(255, 255, 255);
        translate: -39px 150px 0px;
        background: linear-gradient(
          180deg,
          rgb(255, 255, 255) 0%,
          rgba(255, 255, 255, 0.31) 50%,
          rgba(255, 0, 0, 0) 100%
        );
    }

    .cube-dock .main-cube__inside--back {
        translate: -95px 29px 5px;
        transform: rotatex(90deg) rotatey(90deg);
        width: 100%;
        height: calc(70% + 16px);
        background-color: rgb(255, 255, 255);
    }

    .cube-dock .corner {
        position: absolute;
        background-color: rgb(220, 220, 220);
        width: 15%;
        height: 15%;
        position: absolute;
    }

    .cube-dock .corner-2 {
        bottom: 0;
    }

    .cube-dock .corner-3 {
        bottom: 0;
        right: 0;
    }

    .cube-dock .corner-4 {
        right: 0;
    }

    .cube-dock .rectangle {
        position: absolute;
        background-color: rgb(220, 220, 220);
        box-sizing: border-box;
    }

    .cube-dock .rectangle-1 {
        margin-left: calc(15% - 8px);
        border-bottom: 8px solid black;
        height: 15%;
        width: calc(70% + 16px);
    }

    .cube-dock .rectangle-2 {
        bottom: 0;
        margin-left: calc(15% - 8px);
        border-top: 8px solid black;
        height: 15%;
        width: calc(70% + 16px);
    }

    .cube-dock .rectangle-3 {
        height: calc(70% + 16px);
        width: 15%;
        top: calc(15% - 8px);
        border-right: 8px solid black;
    }

    .cube-dock .rectangle-4 {
        height: calc(70% + 16px);
        width: 15%;
        top: calc(15% - 8px);
        right: 0;
        border-left: 8px solid black;
    }

    .cube-dock .rotating-cube {
        position: absolute;
        transform-style: preserve-3d;
        width: 250px;
        height: 250px;
        transition: 0.7s ease-in-out;
    }

    .cube-dock .rotating-cube--rotated {
        transform: rotatey(90deg);
    }

    .cube-dock .rotating-cube__top {
        position: absolute;
        background-color: rgb(220, 220, 220);
        border: 8px solid black;
        box-sizing: border-box;
        width: 100px;
        height: 400px;
        translate: 75px 0px 50px;
        cursor: pointer;
        background: linear-gradient(
          180deg,
          rgb(255, 255, 255) 0%,
          rgb(255 255 255) 50%,
          rgb(220 220 220) 100%
        );
    }

    .cube-dock .rotating-cube__front {
        position: absolute;
        background-color: rgb(220, 220, 220);
        border: 8px solid black;
        box-sizing: border-box;
        width: 100px;
        height: 400px;
        transform: rotatey(90deg);
        translate: 125px 0px 0px;
        cursor: pointer;
        background: linear-gradient(
          180deg,
          rgb(255, 255, 255) 0%,
          rgb(255 255 255) 50%,
          rgb(220 220 220) 100%
        );
    }

    .cube-dock .rotating-cube__bottom {
        position: absolute;
        background-color: rgb(220, 220, 220);
        border: 8px solid black;
        box-sizing: border-box;
        width: 100px;
        height: 400px;
        translate: 75px 0px -50px;
        cursor: pointer;
        background: linear-gradient(
          180deg,
          rgb(255, 255, 255) 0%,
          rgb(255 255 255) 50%,
          rgb(220 220 220) 100%
        );
    }

    .cube-dock .rotating-cube__back {
        position: absolute;
        background-color: rgb(220, 220, 220);
        border: 8px solid black;
        box-sizing: border-box;
        width: 100px;
        height: 400px;
        transform: rotatey(90deg);
        translate: 25px 0px 0px;
        cursor: pointer;
        background: linear-gradient(
          180deg,
          rgb(255, 255, 255) 0%,
          rgb(255 255 255) 50%,
          rgb(220 220 220) 100%
        );
    }

    .cube-dock .rotating-cube__left {
        position: absolute;
        background-color: rgb(220, 220, 220);
        border: 8px solid black;
        box-sizing: border-box;
        width: 100px;
        height: 100px;
        transform: rotatex(90deg) rotatez(180deg) rotatey(180deg);
        cursor: pointer;
        display: flex;
        align-items: center;
        translate: 75px 350px 0px;
    }

    .cube-dock .text {
        opacity: 1;
        width: 100%;
        text-align: center;
        font-size: 1.5rem;
        font-family: sans-serif;
        animation: cubeFadeOut 0.5s ease-in 2s forwards;
    }

    .cube-dock .bulb-cube {
        position: absolute;
        transform-style: preserve-3d;
        width: 250px;
        height: 250px;
        translate: -72px;
        transition: 0.7s ease-in-out;
    }

    .cube-dock .bulb-cube--opened {
        translate: 0;
    }

    .cube-dock .bulb-cube__top {
        position: absolute;
        width: 75px;
        height: 165px;
        translate: 249px 42px 82px;
        box-sizing: border-box;
        border: 8px solid black;
        background-color: white;
    }

    .cube-dock .bulb-cube__left {
        position: absolute;
        width: 75px;
        height: 165px;
        translate: 249px 125px 1px;
        box-sizing: border-box;
        border: 8px solid black;
        transform: rotatex(90deg);
        background-color: white;
    }

    .cube-dock .bulb-cube__front {
        position: absolute;
        width: 165px;
        height: 165px;
        translate: 241px 43px 0px;
        box-sizing: border-box;
        border: 8px solid black;
        transform: rotatey(90deg);
        background-color: rgb(220, 220, 220);
    }

    .cube-dock .bulb-light-left {
        opacity: 0;
        position: absolute;
        width: 175px;
        height: 165px;
        translate: 249px 126px 1px;
        box-sizing: border-box;
        transform: rotatex(90deg);
        background: linear-gradient(
          90deg,
          rgb(255, 255, 255) 0%,
          rgba(255, 255, 255, 0.31) 50%,
          rgba(255, 0, 0, 0) 100%
        );
        transition: 0.7s ease-in-out;
    }

    .cube-dock .bulb-light-top {
        opacity: 0;
        position: absolute;
        width: 175px;
        height: 165px;
        translate: 249px 44px 83px;
        box-sizing: border-box;
        background: linear-gradient(
          90deg,
          rgb(255, 255, 255) 0%,
          rgba(255, 255, 255, 0.31) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transition: 0.7s ease-in-out;
    }

    .cube-dock .bulb-light--on {
        opacity: 0.4;
    }

    .cube-dock .light {
        position: absolute;
        width: 350px;
        border-radius: 80%;
        height: 350px;
        background-color: rgb(255, 255, 255);
        top: 75%;
        left: 75%;
        margin-top: -100%;
        margin-left: -100%;
        opacity: 0;
        filter: blur(45px);
        transition: 0.7s ease-in-out;
    }

    .cube-dock .light--on {
        opacity: 0.3;
    }

    /* ---- Cube lamp dock (bottom left). Origin = centre of the cube scene. ---- */
    .cube-dock {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 0;
      height: 0;
      z-index: 25;
      transform-origin: 0 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .cube-dock, .cube-dock * { pointer-events: none; }
    .cube-dock .rotating-cube > div {
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .cube-dock .scene {
      position: absolute;
      left: -125px;
      top: -125px;
    }
    .cube-dock .text {
      margin: 0;
      color: #111;
      font-size: 1.2rem;
      line-height: 1.15;
    }

    /* "Find all numbers" on the grey face of the part that slides forward.
       The face is turned 90deg in 3D, so the text is counter-rotated to read
       left to right on screen. */
    .cube-dock .bulb-message {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-90deg);
      font-family: sans-serif;
      font-size: 1.35rem;
      line-height: 1.15;
      text-align: center;
      color: #111;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .cube-dock .bulb-message--on {
      opacity: 1;
      transition: opacity 0.4s ease 0.5s;
    }

    /* Placeholder for the next scene */
    .next-scene {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.9s ease, visibility 0s linear 0.9s;
    }
    .next-scene--on {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.9s ease, visibility 0s;
    }
    .next-scene p {
      margin: 0;
      padding: 0 24px;
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.85);
    }

    /* Number label that sits on the highlighted country */
    .globe-label {
      position: absolute;
      left: 50%;
      top: 50%;
      display: none;
      margin: 0;
      padding: 0;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      opacity: 0;
      text-shadow:
        0 0 4px rgba(255, 255, 255, 0.95),
        0 0 14px rgba(127, 212, 255, 0.95),
        0 0 34px rgba(127, 212, 255, 0.65);
      z-index: 15;
    }

    /* ---------- Search bar (from animated-search-bar_v1, page background removed) ----------
       The bar's right end is anchored to the top-right corner; it expands to the left. */
    #content {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 49px);
      right: max(24px, env(safe-area-inset-right, 0px));
      width: 0;
      height: 0;
      margin: 0;
      z-index: 30;
      touch-action: manipulation;
    }

    .input {
      display: block;
      box-sizing: border-box;
      margin: 0;
      width: 50px;
      height: 50px;
      border: 4px solid #ffffff;
      border-radius: 50%;
      background: none;
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      outline: 0;
      -webkit-appearance: none;
      appearance: none;
      -webkit-transition: width 0.4s ease-in-out, border-radius 0.8s ease-in-out, padding 0.2s;
      transition: width 0.4s ease-in-out, border-radius 0.8s ease-in-out, padding 0.2s;
      -webkit-transition-delay: 0.4s;
      transition-delay: 0.4s;
      -webkit-transform: translate(-100%, -50%);
      -ms-transform: translate(-100%, -50%);
      transform: translate(-100%, -50%);
    }

    .input::placeholder {
      color: rgba(255, 255, 255, 0.55);
      opacity: 0;
    }

    .search {
      background: none;
      position: absolute;
      top: 0px;
      left: 0;
      height: 50px;
      width: 50px;
      padding: 0;
      border-radius: 100%;
      outline: 0;
      border: 0;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-transition: 0.2s ease-in-out;
      transition: 0.2s ease-in-out;
      -webkit-transform: translate(-100%, -50%);
      -ms-transform: translate(-100%, -50%);
      transform: translate(-100%, -50%);
    }

    .search:before {
      content: "";
      position: absolute;
      width: 20px;
      height: 4px;
      background-color: #fff;
      -webkit-transform: rotate(45deg);
      -ms-transform: rotate(45deg);
      transform: rotate(45deg);
      margin-top: 26px;
      margin-left: 17px;
      -webkit-transition: 0.2s ease-in-out;
      transition: 0.2s ease-in-out;
    }

    .close {
      -webkit-transition: 0.4s ease-in-out;
      transition: 0.4s ease-in-out;
      -webkit-transition-delay: 0.4s;
      transition-delay: 0.4s;
    }

    .close:before {
      content: "";
      position: absolute;
      width: 27px;
      height: 4px;
      margin-top: -1px;
      margin-left: -13px;
      background-color: #fff;
      -webkit-transform: rotate(45deg);
      -ms-transform: rotate(45deg);
      transform: rotate(45deg);
      -webkit-transition: 0.2s ease-in-out;
      transition: 0.2s ease-in-out;
    }

    .close:after {
      content: "";
      position: absolute;
      width: 27px;
      height: 4px;
      background-color: #fff;
      margin-top: -1px;
      margin-left: -13px;
      cursor: pointer;
      -webkit-transform: rotate(-45deg);
      -ms-transform: rotate(-45deg);
      transform: rotate(-45deg);
    }

    .square {
      box-sizing: border-box;
      padding: 0 40px 0 10px;
      width: 300px;
      width: min(300px, calc(100vw - 48px));
      height: 50px;
      border: 4px solid #ffffff;
      border-radius: 0;
      background: none;
      color: #fff;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 400;
      outline: 0;
      -webkit-transition: width 0.4s ease-in-out, border-radius 0.4s ease-in-out, padding 0.2s;
      transition: width 0.4s ease-in-out, border-radius 0.4s ease-in-out, padding 0.2s;
      -webkit-transition-delay: 0.4s, 0s, 0.4s;
      transition-delay: 0.4s, 0s, 0.4s;
      -webkit-transform: translate(-100%, -50%);
      -ms-transform: translate(-100%, -50%);
      transform: translate(-100%, -50%);
    }

    .square::placeholder {
      opacity: 1;
      transition: opacity 0.2s ease 0.6s;
    }

    .input.no-match {
      border-color: #ff5f5f;
    }

    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(14px, env(safe-area-inset-bottom));
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);
      pointer-events: none;
      z-index: 20;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(80%, 420px);
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid #ff5f5f;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      z-index: 100;
    }
    .message[hidden] { display: none; }

    @media (max-width: 600px) {
      .hint { font-size: 10px; padding-inline: 12px; }
    }
    @media (max-width: 380px) {
      .hint { font-size: 9px; }
    }
  </style>
</head>

<body>
  <div class="world" id="world">
    <div class="world-bg" id="worldBg"></div>
    <div class="world-globe-pole" id="globePole"></div>
    <canvas id="globeCanvas" aria-label="Interactive globe"></canvas>
    <img class="world-globe-halo" id="globeHalo" alt="" aria-hidden="true" draggable="false" hidden>
    <div class="globe-label" id="globeLabel" aria-hidden="true"></div>
  </div>

  <form id="content" role="search" autocomplete="off">
    <input type="text" name="input" class="input" id="search-input"
           placeholder="Search a country" aria-label="Search a country"
           autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" enterkeyhint="search">
    <button type="reset" class="search" id="search-btn"
            aria-label="Toggle search" aria-expanded="false"></button>
  </form>

  <div class="cube-dock" id="cubeDock">
  <div class="scene" id="scene">
          <div class="main-cube">
            <div class="bulb-light-top" id="top-light"></div>
            <div class="bulb-light-left" id="left-light"></div>
            <div class="rotating-light-bottom"></div>
            <div class="rotating-light-back"></div>
            <div class="side main-cube__side-top"></div>
            <div class="side main-cube__side-front">
              <div class="corner corner-1"></div>
              <div class="corner corner-2"></div>
              <div class="corner corner-3"></div>
              <div class="corner corner-4"></div>
              <div class="rectangle rectangle-1"></div>
              <div class="rectangle rectangle-2"></div>
              <div class="rectangle rectangle-3"></div>
              <div class="rectangle rectangle-4"></div>
              <div class="light" id="light"></div>
            </div>
            <div class="side main-cube__side-left">
              <div class="corner corner-1"></div>
              <div class="corner corner-2"></div>
              <div class="corner corner-3"></div>
              <div class="corner corner-4"></div>
              <div class="rectangle rectangle-1"></div>
              <div class="rectangle rectangle-2"></div>
              <div class="rectangle rectangle-3"></div>
              <div class="rectangle rectangle-4"></div>
            </div>
            <div class="inside hatching main-cube__inside main-cube__inside--bottom"></div>
            <div class="inside hatching main-cube__inside main-cube__inside--back"></div>
          </div>

          <div class="rotating-cube" id="rotating-cube">
            <div class="rotating-cube__top"></div>
            <div class="rotating-cube__front"></div>
            <div class="rotating-cube__bottom"></div>
            <div class="rotating-cube__back"></div>
            <div class="rotating-cube__left">
              <p class="text">Click to move forward</p>
            </div>
          </div>
          <div class="bulb-cube" id="bulb-cube">
            <div class="hatching bulb-cube__top"></div>
            <div class="hatching bulb-cube__left"></div>
            <div class="bulb-cube__front"><div class="bulb-message" id="bulb-message">Find all numbers</div></div>
          </div>
        </div>
  </div>

  <div class="next-scene" id="nextScene" aria-hidden="true">
    <p>Next scene (placeholder)</p>
  </div>

  <div class="hint">Drag to rotate &middot; Scroll or pinch to zoom</div>
  <div class="message" id="message" hidden></div>

  <script>
  (() => {
    "use strict";

    const SOURCES = {
      bg: "assets/globe_bg.jpg",
      diffuse: "assets/globe_diffuse.jpg",
      halo: "assets/globe_halo.png"
    };

    const config = {
      lat: 0,
      lng: 0,
      zoom: 0,                 // current (smoothed) zoom, 0..1
      autoSpin: true,
      isHaloVisible: true,
      isPoleVisible: true,
      spinDegreesPerSecond: 12, // reference: 0.2 deg per frame at 60 fps
      maxDpr: 2,
      maxBufferPx: 2048
    };

    /* ---- Constants taken from the reference ---- */
    const BASE_GLOBE_SIZE = 536;     // globe diameter in px
    const PERSPECTIVE = (BASE_GLOBE_SIZE / 2) / 4000; // offset = 1 + z / 4000 (z in px)
    const POLE_GAP = 0.05;           // v = 0.05 .. 0.95 of the sphere
    const SEG_X = 72;
    const SEG_Y = 36;
    const EXTENT = 1.08;             // canvas half-size in globe radii (small safety margin)

    /* ---- DOM ---- */
    const world = document.getElementById("world");
    const worldBg = document.getElementById("worldBg");
    const globePole = document.getElementById("globePole");
    const canvas = document.getElementById("globeCanvas");
    const globeHalo = document.getElementById("globeHalo");
    const labelEl = document.getElementById("globeLabel");
    const message = document.getElementById("message");

    /* ---- State ---- */
    let gl = null, program = null, texture = null;
    let vertexBuffer = null, indexBuffer = null, indexCount = 0;
    let uRotY, uRotX, uExtent, uTexture, uOverlay, uRect, uOverlayAlpha;
    let overlayTexture = null;
    let glReady = false;
    let isWebGL2 = false;
    let diffuseImage = null;

    let zoomTarget = 0;
    let needsResize = true;
    let lastFrameTime = performance.now();
    let tween = null;
    let currentScale = 1; // globe scale (fit * zoom), updated in resizeCanvas
    let spinHold = false; // true while a searched country is highlighted

    /* Outline overlay state (country search) */
    const overlay = { canvas: null, rect: [0, 0, 1, 1], alpha: 0, target: 0 };
    /* Number label: popStart < 0 means it has not popped in yet. */
    const label = { lat: 0, lng: 0, scale: 1, fade: 0, target: 0, popStart: -1 };

    let isPointerDown = false;
    const pointers = new Map();
    let dragX = 0, dragY = 0, dragLat = 0, dragLng = 0;
    let pinchStartDist = 0, pinchStartZoom = 0;

    /* ---- Helpers ---- */
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const clampLng = (l) => ((((l + 180) % 360) + 360) % 360) - 180;
    const degToRad = (d) => d * Math.PI / 180;
    const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
    const isPOT = (n) => (n & (n - 1)) === 0;

    function showMessage(html) { message.innerHTML = html; message.hidden = false; }
    function hideMessage() { message.hidden = true; }

    /* ---- Shaders ----
       The vertex shader repeats the reference's rotate() maths exactly:
       rotate around Y, then X, then a weak depth scale of 1 + z/4000.
       Screen y points down in the reference, so it is flipped for clip space.
       Triangles are front-facing (CCW) only on the near side, so back-face
       culling hides the far side just like the reference does. */
    const vertexShaderSource = `
      attribute vec3 aPosition;
      attribute vec2 aUv;
      uniform vec2 uRotY;   // sin, cos of rY
      uniform vec2 uRotX;   // sin, cos of -rX
      uniform float uExtent;
      varying vec2 vUv;

      void main() {
        vUv = aUv;
        float x0 = aPosition.x * uRotY.y - aPosition.z * uRotY.x;
        float z0 = aPosition.z * uRotY.y + aPosition.x * uRotY.x;
        float y0 = aPosition.y * uRotX.y - z0 * uRotX.x;
        z0 = z0 * uRotX.y + aPosition.y * uRotX.x;
        float k = 1.0 + z0 * ${PERSPECTIVE.toFixed(6)};
        gl_Position = vec4(x0 * k / uExtent, -y0 * k / uExtent, 0.0, 1.0);
      }
    `;

    const fragmentShaderSource = `
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif
      uniform sampler2D uTexture;
      uniform sampler2D uOverlay;      // country outline, covers only uRect of the map
      uniform vec4 uRect;              // overlay origin (u, v) and size (du, dv)
      uniform float uOverlayAlpha;
      varying vec2 vUv;
      void main() {
        vec4 base = texture2D(uTexture, vUv);
        vec2 l = (vUv - uRect.xy) / uRect.zw;
        vec4 o = texture2D(uOverlay, l);
        float inside = step(0.0, l.x) * step(l.x, 1.0) * step(0.0, l.y) * step(l.y, 1.0);
        o *= inside * uOverlayAlpha;
        gl_FragColor = vec4(base.rgb * (1.0 - o.a) + o.rgb, base.a);
      }
    `;

    /* ---- WebGL setup ---- */
    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(s);
        gl.deleteShader(s);
        throw new Error("Shader compile failed: " + log);
      }
      return s;
    }

    function createProgram() {
      const vs = compile(gl.VERTEX_SHADER, vertexShaderSource);
      const fs = compile(gl.FRAGMENT_SHADER, fragmentShaderSource);
      const p = gl.createProgram();
      gl.attachShader(p, vs);
      gl.attachShader(p, fs);
      gl.bindAttribLocation(p, 0, "aPosition");
      gl.bindAttribLocation(p, 1, "aUv");
      gl.linkProgram(p);
      gl.deleteShader(vs);
      gl.deleteShader(fs);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        const log = gl.getProgramInfoLog(p);
        gl.deleteProgram(p);
        throw new Error("Program link failed: " + log);
      }
      return p;
    }

    function createSphereMesh() {
      const vertices = [];
      const indices = [];

      for (let y = 0; y <= SEG_Y; y++) {
        const v = y / SEG_Y;                                // texture v: full image height
        const theta = (POLE_GAP + v * (1 - 2 * POLE_GAP)) * Math.PI; // geometry: 5%..95%
        const sinT = Math.sin(theta), cosT = Math.cos(theta);

        for (let x = 0; x <= SEG_X; x++) {
          const u = x / SEG_X;
          const phi = u * Math.PI * 2;
          vertices.push(
            -Math.cos(phi) * sinT,
            -cosT,
            Math.sin(phi) * sinT,
            u,
            v
          );
        }
      }

      const row = SEG_X + 1;
      for (let y = 0; y < SEG_Y; y++) {
        for (let x = 0; x < SEG_X; x++) {
          const a = y * row + x, b = a + 1, c = a + row, d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      vertexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

      indexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);
      indexCount = indices.length;
    }

    function createTexture(image) {
      texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

      /* The mesh duplicates the seam column, so clamping is safe and also
         works for non power-of-two textures on WebGL 1. */
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);

      const canMip = isWebGL2 || (isPOT(image.naturalWidth) && isPOT(image.naturalHeight));
      if (canMip) {
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        const ext = gl.getExtension("EXT_texture_filter_anisotropic");
        if (ext) {
          const max = gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
          gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(4, max));
        }
      } else {
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      }
    }

    function setupGL(image) {
      program = createProgram();
      gl.useProgram(program);

      uRotY = gl.getUniformLocation(program, "uRotY");
      uRotX = gl.getUniformLocation(program, "uRotX");
      uExtent = gl.getUniformLocation(program, "uExtent");
      uTexture = gl.getUniformLocation(program, "uTexture");

      createSphereMesh();
      createTexture(image);

      gl.disable(gl.DEPTH_TEST);
      gl.enable(gl.CULL_FACE);
      gl.cullFace(gl.BACK);
      gl.frontFace(gl.CCW);
      gl.clearColor(0, 0, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.uniform1i(uTexture, 0);
      gl.uniform1f(uExtent, EXTENT);

      /* Overlay texture on unit 1 (transparent 1x1 until a country is chosen) */
      uOverlay = gl.getUniformLocation(program, "uOverlay");
      uRect = gl.getUniformLocation(program, "uRect");
      uOverlayAlpha = gl.getUniformLocation(program, "uOverlayAlpha");

      overlayTexture = gl.createTexture();
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, overlayTexture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
      gl.activeTexture(gl.TEXTURE0);

      gl.uniform1i(uOverlay, 1);
      gl.uniform4f(uRect, overlay.rect[0], overlay.rect[1], overlay.rect[2], overlay.rect[3]);
      gl.uniform1f(uOverlayAlpha, 0);

      if (overlay.canvas) uploadOverlay(overlay.canvas); // after a context restore
    }

    function uploadOverlay(source) {
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, overlayTexture);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.activeTexture(gl.TEXTURE0);
      gl.uniform4f(uRect, overlay.rect[0], overlay.rect[1], overlay.rect[2], overlay.rect[3]);
    }

    function initialiseWebGL(image) {
      const opts = {
        alpha: true,
        antialias: true,
        depth: false,
        stencil: false,
        premultipliedAlpha: true,
        preserveDrawingBuffer: false,
        powerPreference: "high-performance"
      };

      gl = canvas.getContext("webgl2", opts);
      isWebGL2 = !!gl;
      if (!gl) {
        gl = canvas.getContext("webgl", opts) || canvas.getContext("experimental-webgl", opts);
      }
      if (!gl) throw new Error("WebGL is not available in this browser.");

      setupGL(image);
      glReady = true;
    }

    /* ---- Responsive sizing ---- */
    function getViewportSize() {
      const vv = window.visualViewport;
      return {
        width: vv && vv.width ? vv.width : window.innerWidth,
        height: vv && vv.height ? vv.height : window.innerHeight
      };
    }

    /* Fit factor: 1.0 on laptops (identical to the reference 536 px globe),
       smaller on phones so the globe and halo stay fully on screen. */
    function getFitScale() {
      const { width, height } = getViewportSize();
      const shortest = Math.min(width, height);
      const isMobile = Math.max(width, height) <= 600;
      const ratio = isMobile ? 0.74 : 0.78;
      const size = clamp(shortest * ratio, isMobile ? 170 : 295, isMobile ? 460 : BASE_GLOBE_SIZE);
      return size / BASE_GLOBE_SIZE;
    }

    function getTotalScale() {
      /* Reference: ratio = 1 + zoom^1.5 * 3 */
      return getFitScale() * (1 + Math.pow(config.zoom, 1.5) * 3);
    }

    function resizeCanvas() {
      const scale = getTotalScale();
      currentScale = scale;
      const cssSize = BASE_GLOBE_SIZE * scale * EXTENT;
      const dpr = Math.min(window.devicePixelRatio || 1, config.maxDpr);

      /* Quantised buffer size avoids reallocating the framebuffer every frame
         while zooming; the cap keeps phones within their GPU limits. */
      let px = Math.ceil((cssSize * dpr) / 32) * 32;
      px = clamp(px, 64, config.maxBufferPx);

      if (canvas.width !== px || canvas.height !== px) {
        canvas.width = px;
        canvas.height = px;
        gl.viewport(0, 0, px, px);
      }

      canvas.style.width = cssSize + "px";
      canvas.style.height = cssSize + "px";

      const t = "scale(" + scale + ")";
      globeHalo.style.transform = t;
      globePole.style.transform = t;

      /* Reference: background ratio = 1 + zoom^3 * 0.3 */
      const bg = 1 + Math.pow(config.zoom, 3) * 0.3;
      worldBg.style.transform = "scale3d(" + bg + "," + bg + ",1)";
    }

    /* ---- Render ---- */
    function render(dt, now) {
      if (config.autoSpin && !spinHold && !isPointerDown && !tween) {
        config.lng = clampLng(config.lng - config.spinDegreesPerSecond * dt);
      }

      globeHalo.style.display = config.isHaloVisible && !globeHalo.hidden ? "block" : "none";
      globePole.style.display = config.isPoleVisible ? "block" : "none";

      const rY = degToRad(clampLng(config.lng) - 270);
      const rX = degToRad(config.lat);

      gl.useProgram(program);
      gl.uniform2f(uRotY, Math.sin(rY), Math.cos(rY));
      gl.uniform2f(uRotX, Math.sin(-rX), Math.cos(-rX));

      /* Outline fades in/out and breathes very slightly while active. */
      const pulse = 0.9 + 0.1 * Math.sin(now * 0.004);
      gl.uniform1f(uOverlayAlpha, overlay.alpha * pulse);

      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
    }

    /* ---- Animation loop ---- */
    function updateTween(now) {
      if (!tween) return;
      const p = tween.duration <= 0 ? 1 : clamp((now - tween.start) / tween.duration, 0, 1);
      const e = easeInOutSine(p);
      config.lat = tween.lat + tween.dLat * e;
      config.lng = clampLng(tween.lng + tween.dLng * e);
      if (p >= 1) {
        const done = tween.onDone;
        tween = null;
        if (done) done();
      }
    }

    function updateZoom(dt) {
      const diff = zoomTarget - config.zoom;
      if (diff === 0) return;
      /* Frame-rate independent easing gives smooth wheel and pinch zoom. */
      config.zoom += diff * (1 - Math.exp(-dt * 14));
      if (Math.abs(zoomTarget - config.zoom) < 0.0004) config.zoom = zoomTarget;
      needsResize = true;
    }

    function updateOverlay(dt) {
      const diff = overlay.target - overlay.alpha;
      if (diff === 0) return;
      overlay.alpha += diff * (1 - Math.exp(-dt * 7));
      if (Math.abs(overlay.target - overlay.alpha) < 0.01) overlay.alpha = overlay.target;
    }

    /* Same maths as the vertex shader: where a map point sits on screen,
       in globe radii from the globe centre (x right, y down), plus its depth. */
    function projectToScreen(lat, lng) {
      const phi = ((lng + 180) / 360) * Math.PI * 2;
      const v = (90 - lat) / 180;
      const theta = (POLE_GAP + v * (1 - 2 * POLE_GAP)) * Math.PI;
      const sinT = Math.sin(theta);
      const x = -Math.cos(phi) * sinT;
      const y = -Math.cos(theta);
      const z = Math.sin(phi) * sinT;

      const rY = degToRad(clampLng(config.lng) - 270);
      const rX = degToRad(config.lat);
      const sY = Math.sin(rY), cY = Math.cos(rY);
      const sX = Math.sin(-rX), cX = Math.cos(-rX);

      const x0 = x * cY - z * sY;
      let z0 = z * cY + x * sY;
      const y0 = y * cX - z0 * sX;
      z0 = z0 * cX + y * sX;

      const k = 1 + z0 * PERSPECTIVE;
      return { x: x0 * k, y: y0 * k, z: z0 };
    }

    const easeOutBack = (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };

    function updateLabel(dt, now) {
      if (label.target === 1 && labelEl.style.display !== "block") {
        labelEl.style.display = "block";
      }

      const diff = label.target - label.fade;
      if (diff !== 0) {
        label.fade += diff * (1 - Math.exp(-dt * 12));
        if (Math.abs(label.target - label.fade) < 0.01) label.fade = label.target;
      }

      if (label.fade === 0 && label.target === 0) {
        if (labelEl.style.display !== "none") labelEl.style.display = "none";
        label.popStart = -1;
        return;
      }

      if (label.popStart < 0) {            // waiting for the globe to arrive
        labelEl.style.opacity = "0";
        return;
      }

      const p = clamp((now - label.popStart) / 650, 0, 1);
      const pop = Math.max(0, easeOutBack(p));  // 0 -> slight overshoot -> 1

      const pos = projectToScreen(label.lat, label.lng);
      /* Fade out as the country turns towards the globe's edge / far side. */
      const facing = clamp((pos.z - 0.1) / 0.3, 0, 1);

      const radius = (BASE_GLOBE_SIZE / 2) * currentScale;
      const pulse = 0.92 + 0.08 * Math.sin(now * 0.004);

      labelEl.style.opacity = String(label.fade * facing * pulse);
      labelEl.style.transform =
        "translate3d(" + (pos.x * radius) + "px," + (pos.y * radius) + "px,0) " +
        "translate(-50%,-50%) scale(" + (pop * currentScale * label.scale) + ")";
    }

    function frame(now) {
      const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
      lastFrameTime = now;

      updateTween(now);
      updateZoom(dt);
      updateOverlay(dt);

      if (glReady) {
        if (needsResize) {
          needsResize = false;
          resizeCanvas();
        }
        render(dt, now);
      }
      updateLabel(dt, now);
      requestAnimationFrame(frame);
    }

    /* ---- Public navigation helper ---- */
    function goTo(lat, lng, zoomTo, onArrive) {
      if (typeof zoomTo === "number") zoomTarget = clamp(zoomTo, 0, 1);
      const targetLng = clampLng(lng);
      let dLng = targetLng - config.lng;
      if (dLng > 180) dLng -= 360;
      if (dLng < -180) dLng += 360;
      const dLat = lat - config.lat;
      const distance = Math.sqrt(dLat * dLat + dLng * dLng);

      tween = {
        start: performance.now(),
        duration: clamp(distance * 0.01, 0.2, 1.5) * 1000,
        lat: config.lat,
        lng: config.lng,
        dLat,
        dLng,
        onDone: onArrive || null
      };
    }

    /* ---- Pointer / touch ---- */
    function beginDrag(x, y) {
      dragX = x; dragY = y;
      dragLat = config.lat; dragLng = config.lng;
    }

    function pinchDistance() {
      const [a, b] = Array.from(pointers.values());
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function onPointerDown(e) {
      tween = null;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { world.setPointerCapture(e.pointerId); } catch (_) {}

      if (pointers.size === 1) {
        beginDrag(e.clientX, e.clientY);
      } else if (pointers.size === 2) {
        pinchStartDist = pinchDistance();
        pinchStartZoom = zoomTarget;
      }

      isPointerDown = true;
      world.classList.add("dragging");
    }

    function onPointerMove(e) {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      p.x = e.clientX;
      p.y = e.clientY;

      if (pointers.size >= 2) {
        const { width, height } = getViewportSize();
        const span = Math.min(width, height) * 0.8;
        zoomTarget = clamp(pinchStartZoom + (pinchDistance() - pinchStartDist) / span, 0, 1);
        return;
      }

      /* Same drag mapping as the reference: 0.5 degrees per pixel. */
      config.lat = clamp(dragLat + (e.clientY - dragY) * 0.5, -90, 90);
      config.lng = clampLng(dragLng - (e.clientX - dragX) * 0.5);
    }

    function onPointerUp(e) {
      if (!pointers.delete(e.pointerId)) return;

      if (pointers.size === 1) {
        const rest = pointers.values().next().value;
        beginDrag(rest.x, rest.y);
      }
      if (pointers.size === 0) {
        isPointerDown = false;
        world.classList.remove("dragging");
      }
    }

    function onWheel(e) {
      e.preventDefault();
      /* deltaMode 1 = lines (some mice / Firefox); normalise to pixels. */
      const delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
      zoomTarget = clamp(zoomTarget - delta * 0.001, 0, 1);
    }

    function onDoubleClick() {
      zoomTarget = zoomTarget > 0.4 ? 0 : 0.55;
    }

    /* =====================================================================
       COUNTRY SEARCH
       Boundary data: Natural Earth 1:50m (public domain), Norway incl. Svalbard

    /* Calibration if the outline ever sits slightly off the texture's coastlines. */
    const OVERLAY_LNG_OFFSET = 0;   // degrees, + = east
    const OVERLAY_LAT_OFFSET = 0;   // degrees, + = north

    const OVERLAY_PPD = 32;         // overlay pixels per degree
    const OVERLAY_PAD = 3;          // degrees of empty margin for the glow
    const OVERLAY_MAX_PX = 2048;

    let activeCountry = null;
    const foundCountries = new Set();   // countries the user has searched so far
    let onProgress = null;              // called whenever a new country is found

    const allNumbersFound = () => COUNTRIES.every((c) => foundCountries.has(c.name));

    function normalise(text) {
      return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
    }

    /* Draws the country into a small transparent canvas that covers only its
       bounding box on the equirectangular map, and returns it with the box. */
    function buildOverlay(country) {
      if (country._overlay) return country._overlay;

      let minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
      for (const poly of country.polygons) {
        for (const ring of poly) {
          for (let i = 0; i < ring.length; i += 2) {
            const lng = ring[i] + OVERLAY_LNG_OFFSET;
            const lat = ring[i + 1] + OVERLAY_LAT_OFFSET;
            if (lng < minLng) minLng = lng;
            if (lng > maxLng) maxLng = lng;
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
          }
        }
      }
      minLng -= OVERLAY_PAD; maxLng += OVERLAY_PAD;
      minLat = Math.max(-90, minLat - OVERLAY_PAD);
      maxLat = Math.min(90, maxLat + OVERLAY_PAD);

      const wDeg = maxLng - minLng, hDeg = maxLat - minLat;
      const ppd = Math.min(OVERLAY_PPD, OVERLAY_MAX_PX / Math.max(wDeg, hDeg));
      const W = Math.ceil(wDeg * ppd), H = Math.ceil(hDeg * ppd);

      const cv = document.createElement("canvas");
      cv.width = W;
      cv.height = H;
      const ctx = cv.getContext("2d");

      /* Equirectangular maps stretch east-west at high latitude. Drawing with a
         pen that is isotropic in (lng * cos(lat), lat) space keeps the outline
         the same thickness on the globe in every direction. */
      const c = Math.cos(degToRad(country.view.lat));
      ctx.setTransform(ppd / c, 0, 0, -ppd, -minLng * ppd, maxLat * ppd);

      const path = new Path2D();
      for (const poly of country.polygons) {
        for (const ring of poly) {
          for (let i = 0; i < ring.length; i += 2) {
            const x = (ring[i] + OVERLAY_LNG_OFFSET) * c;
            const y = ring[i + 1] + OVERLAY_LAT_OFFSET;
            if (i === 0) path.moveTo(x, y); else path.lineTo(x, y);
          }
          path.closePath();
        }
      }

      ctx.fillStyle = "rgba(127, 212, 255, 0.16)";
      ctx.fill(path, "evenodd");

      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      const passes = [                       // [width in degrees, colour]
        [2.0, "rgba(127, 212, 255, 0.06)"],  // soft glow
        [1.2, "rgba(127, 212, 255, 0.10)"],
        [0.7, "rgba(150, 222, 255, 0.20)"],
        [0.3, "#ffffff"]                     // crisp outline
      ];
      for (const [width, colour] of passes) {
        ctx.lineWidth = width * (country.lineScale || 1);
        ctx.strokeStyle = colour;
        ctx.stroke(path);
      }

      /* Overlay rectangle in texture (u, v) space: u = (lng + 180) / 360,
         v = (90 - lat) / 180, measured from the top-left of the map. */
      country._overlay = {
        canvas: cv,
        rect: [
          (minLng + 180) / 360,
          (90 - maxLat) / 180,
          W / ppd / 360,
          H / ppd / 180
        ]
      };
      return country._overlay;
    }

    function highlightCountry(country) {
      if (activeCountry === country) return;

      const built = buildOverlay(country);
      overlay.canvas = built.canvas;
      overlay.rect = built.rect;
      if (glReady) uploadOverlay(built.canvas);

      activeCountry = country;
      foundCountries.add(country.name);
      if (onProgress) onProgress();
      overlay.target = 1;
      spinHold = true;

      label.lat = country.label.lat;
      label.lng = country.label.lng;
      label.scale = country.labelScale || 1;
      label.target = 1;
      label.popStart = performance.now();   // bounce the number in straight away
      labelEl.textContent = country.label.text;
    }

    function clearHighlight() {
      if (!activeCountry) return;

      activeCountry = null;
      overlay.target = 0;
      label.target = 0;
      spinHold = false;
    }

      const n = normalise(String(name));
      return COUNTRIES.find((c) => c.aliases.includes(n)) || null;

        const n = normalise(q);
        return COUNTRIES.find((c) => c.aliases.includes(n)) || null;
      };
      const findPrefix = (q) => {
        const n = normalise(q);
        if (n.length < 3) return null;
        const hits = COUNTRIES.filter((c) => c.aliases.some((a) => a.startsWith(n)));

          input.value = country.name;
          highlightCountry(country);
        } else if (normalise(input.value)) {
          input.classList.add("no-match");
          clearTimeout(flashTimer);
          flashTimer = setTimeout(() => input.classList.remove("no-match"), 700);
        }
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && open) {
          input.value = "";
          setOpen(false);
        }
      });
    }

    /* ---- Cube lamp ---- */
    function initCube() {
      const dock = document.getElementById("cubeDock");
      const rotatingCube = document.getElementById("rotating-cube");
      const bulbCube = document.getElementById("bulb-cube");
      const topLight = document.getElementById("top-light");
      const leftLight = document.getElementById("left-light");
      const light = document.getElementById("light");
      const message = document.getElementById("bulb-message");
      const nextScene = document.getElementById("nextScene");

      /* Projected size of the whole cube around its centre (measured from the
         scene's 3D transform): 305 px left, 269 right, 188 up, 202 down. */
      const BOX = { left: 305, right: 269, up: 188, down: 202 };
      const MARGIN = 16;

      let isOpen = false;
      let leaving = false;

      function layoutCube() {
        const { width, height } = getViewportSize();
        const boxWidth = BOX.left + BOX.right;
        const boxHeight = BOX.up + BOX.down;
        const widthShare = width < 700 ? 0.6 : 0.3;
        const scale = Math.min(0.6, (width * widthShare) / boxWidth, (height * 0.4) / boxHeight);

        dock.style.left = "calc(env(safe-area-inset-left, 0px) + " + (MARGIN + BOX.left * scale) + "px)";
        dock.style.bottom = "calc(env(safe-area-inset-bottom, 0px) + " + (MARGIN + BOX.down * scale) + "px)";
        dock.style.transform = "scale(" + scale + ")";
      }

      function setOpen(open) {
        isOpen = open;
        rotatingCube.classList.toggle("rotating-cube--rotated", open);
        bulbCube.classList.toggle("bulb-cube--opened", open);
        topLight.classList.toggle("bulb-light--on", open);
        leftLight.classList.toggle("bulb-light--on", open);
        light.classList.toggle("light--on", open);
      }

      /* "Find all numbers" shows only while the cube is open and numbers are missing. */
      function updateMessage() {
        message.classList.toggle("bulb-message--on", isOpen && !allNumbersFound());
      }

      function showNextScene() {
        nextScene.classList.add("next-scene--on");
        nextScene.setAttribute("aria-hidden", "false");
      }

      function onCubeClick() {
        if (leaving) return;

        if (allNumbersFound()) {
          /* Open the cube, switch the light on, then move to the next scene. */
          leaving = true;
          setOpen(true);
          updateMessage();
          setTimeout(showNextScene, 1000);
          return;
        }

        setOpen(!isOpen);
        updateMessage();
      }

      rotatingCube.querySelectorAll(":scope > div").forEach((face) => {
        face.addEventListener("click", onCubeClick);
      });

      onProgress = updateMessage;

      layoutCube();
      window.addEventListener("resize", layoutCube, { passive: true });
      window.addEventListener("orientationchange", layoutCube, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", layoutCube, { passive: true });
      }
    }

    /* ---- Loading ---- */
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = "async";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Could not load " + url));
        img.src = url;
      });
    }

    async function init() {
      try {
        hideMessage();

        const [diffuse, bg, halo] = await Promise.all([
          loadImage(SOURCES.diffuse),
          loadImage(SOURCES.bg).catch(() => null),
          loadImage(SOURCES.halo).catch(() => null)
        ]);

        diffuseImage = diffuse;

        if (bg) worldBg.style.backgroundImage = 'url("' + SOURCES.bg + '")';
        if (halo) {
          globeHalo.src = SOURCES.halo;
          globeHalo.hidden = false;
        }

        initialiseWebGL(diffuseImage);
        resizeCanvas();

        canvas.addEventListener("webglcontextlost", (e) => {
          e.preventDefault();
          glReady = false;
        });
        canvas.addEventListener("webglcontextrestored", () => {
          try {
            setupGL(diffuseImage);
            glReady = true;
            canvas.width = 0; // force viewport refresh
            needsResize = true;
          } catch (err) {
            console.error(err);
          }
        });

        world.addEventListener("dragstart", (e) => e.preventDefault());
        world.addEventListener("pointerdown", onPointerDown);
        world.addEventListener("pointermove", onPointerMove);
        world.addEventListener("pointerup", onPointerUp);
        world.addEventListener("pointercancel", onPointerUp);
        world.addEventListener("lostpointercapture", onPointerUp);
        world.addEventListener("wheel", onWheel, { passive: false });
        world.addEventListener("dblclick", onDoubleClick);

        const queueResize = () => { needsResize = true; };
        window.addEventListener("resize", queueResize, { passive: true });
        window.addEventListener("orientationchange", queueResize, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", queueResize, { passive: true });
        }

        window.GlobeApp = {
          config,
          goTo,
          setZoom: (z) => { zoomTarget = clamp(z, 0, 1); },
          resize: queueResize,
          highlight: (name) => {
            const c = findCountryByName(name);
            if (c) highlightCountry(c);
          },
          clearHighlight,
          found: () => Array.from(foundCountries)
        };

        initSearch();
        initCube();

        lastFrameTime = performance.now();
        requestAnimationFrame(frame);
      } catch (error) {
        console.error(error);
        showMessage(
          "Could not initialise the globe.<br><br>" +
          "Make sure the repository contains:<br><br>" +
          "<code>assets/globe_diffuse.jpg</code><br>" +
          "<code>assets/globe_bg.jpg</code><br>" +
          "<code>assets/globe_halo.png</code> (optional)<br><br>" +
          "Also make sure the browser supports WebGL."
        );
      }
    }

    init();
  })();
  </script>
</body>
</html>
